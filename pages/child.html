<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>子ども向けSOS</title>

<link rel="stylesheet" href="../css/style.css">
</head>

<body class="child-page">

<header>

    <h1>
        たすけてサイト
    </h1>

</header>

<main>

    <button class="child-sos-btn" onclick="showSOS()">
        たすけて！
    </button>

    <button class="child-alarm-btn" onclick="playAlarm(this)">
        おとをならす
    </button>

    <button class="child-location-btn" onclick="shareLocation()">
    かぞくにばしょをおくる
    </button>

    <p id="location-text"></p>

    <a href="../index.html" class="back-btn">
        もどる
    </a>

</main>

<!-- SOS画面 -->
<div id="sos-screen">

    <p>
        たすけて！
    </p>

</div>

<!-- 音 -->
<audio id="alarm-sound">
    <source src="../audio/alarm.mp3" type="audio/mpeg">
</audio>

<script src="../js/script.js"></script>

</body>
</html>
